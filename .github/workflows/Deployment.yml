name: CI/CD - Deploy Website to GitHub Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:

  # =========================
  # CI - Validate Website
  # =========================
  ci:
    name: CI - Validate Website
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check required files
        run: |
          test -f index.html
          test -f css/styles.css
          test -f js/app.js
          echo "Required website files found."

      - name: Check JavaScript syntax
        run: |
          node --check js/app.js

      - name: Validate HTML
        uses: Cyb3r-Jak3/html5validator-action@v7
        with:
          root: .

  # =========================
  # CD - Deploy Website
  # =========================
  deploy:
    name: CD - Deploy to GitHub Pages
    needs: ci
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4